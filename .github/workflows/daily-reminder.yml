name: 每日 EnglishPod 单词提醒

on:
  schedule:
    # GitHub Actions 定时任务经常延迟数小时甚至跳过
    # 设置多个时间点提高命中率，去重逻辑保证每天只推一次
    - cron: "0 0 * * *"     # UTC 00:00 = 北京 08:00
    - cron: "0 6 * * *"     # UTC 06:00 = 北京 14:00
    - cron: "0 12 * * *"    # UTC 12:00 = 北京 20:00
  workflow_dispatch:  # 允许手动触发测试

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限来保存推送进度
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 发送微信通知
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python3 push.py

      - name: 提交推送进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet progress.json; then
            echo "进度无变化，跳过提交"
          else
            git add progress.json
            git commit -m "更新推送进度"
            git push
          fi
